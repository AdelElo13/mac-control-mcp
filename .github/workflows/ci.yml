name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: swift build + test
    # macos-15 ships Xcode 16 by default, which bundles Swift 6 — we
    # need that because Package.swift declares
    # `swift-tools-version: 6.0`. macos-14 defaults to Xcode 15 /
    # Swift 5.10, which refuses to parse the manifest.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain selection
        run: |
          xcode-select --print-path
          swift --version
          xcodebuild -version

      - name: Show toolchain info
        run: |
          echo "=== macOS ==="
          sw_vers
          echo "=== Swift ==="
          swift --version

      - name: swift build (debug)
        run: swift build

      - name: Entitlements cover every Info.plist usage description
        # Signs a throwaway hardened-runtime bundle with the checked-in
        # Info.plist + entitlements and verifies via `codesign -d
        # --entitlements -` — the v0.8.2 calendar/contacts/mic regression.
        run: |
          scripts/check-entitlements.sh --info-plist scripts/bundle/Info.plist \
            --entitlements scripts/bundle/MacControlMCP.entitlements
          APP="$RUNNER_TEMP/MacControlMCP.app"
          mkdir -p "$APP/Contents/MacOS"
          cp .build/debug/mac-control-mcp "$APP/Contents/MacOS/MacControlMCP"
          sed "s/__VERSION__/0.0.0-ci/" scripts/bundle/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --options runtime --sign - \
            --entitlements scripts/bundle/MacControlMCP.entitlements "$APP"
          scripts/check-entitlements.sh "$APP"

      - name: swift test
        # `swift test` on macos-15 returns non-zero when a subprocess
        # hits SIGPIPE during shutdown — a known SPM issue that fires
        # even when every assertion passes. We check the actual Swift
        # Testing output for real failures and only fail on those,
        # treating the spurious SIGPIPE as an ignored signal.
        #
        # `script` gives swift-testing a pty so its per-test lines reach
        # the log as they happen; through a plain pipe they were fully
        # buffered and a hanging test left 19 minutes of silence.
        timeout-minutes: 12
        run: |
          set +e
          script -q /dev/null swift test --no-parallel 2>&1 | tee /tmp/test.log
          set -e
          if grep -qE "✘ Suite .* failed|✘ Test .* failed after" /tmp/test.log; then
            echo "Real test failures detected." >&2
            exit 1
          fi
          if grep -qE "error: build failed|error: compile" /tmp/test.log; then
            echo "Build error during test." >&2
            exit 1
          fi
          echo "All Swift Testing suites passed."

  npm-package:
    name: npm launcher (npm/)
    # macos-15 so `npm pack` and the launcher tests run on the same platform
    # the package targets (`"os": ["darwin"]`).
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm ci
        # --ignore-scripts keeps the postinstall from downloading the release
        # tarball: CI only exercises the launcher and the pure helpers.
        working-directory: npm
        run: npm ci --ignore-scripts

      - name: Fetch a notarized bundle as the signed test fixture
        # The fast-path and postinstall e2e tests need a real Developer ID
        # signed MacControlMCP.app (codesign / Team ID / spctl cannot be
        # faked) and skip without one. Pull the published v0.8.3 release and
        # check it against its .sha256 asset before handing it to the tests.
        env:
          FIXTURE_VERSION: 0.8.3
        run: |
          set -euo pipefail
          BASE="https://github.com/AdelElo13/mac-control-mcp/releases/download/v${FIXTURE_VERSION}"
          NAME="MacControlMCP-v${FIXTURE_VERSION}-macos-universal"
          DIR="$RUNNER_TEMP/fixture"
          mkdir -p "$DIR"
          curl -fsSL --retry 3 -o "$DIR/$NAME.tar.gz" "$BASE/$NAME.tar.gz"
          curl -fsSL --retry 3 -o "$DIR/$NAME.sha256" "$BASE/$NAME.sha256"
          (cd "$DIR" && shasum -a 256 -c "$NAME.sha256")
          tar -xzf "$DIR/$NAME.tar.gz" -C "$DIR"
          codesign -dv --verbose=4 "$DIR/MacControlMCP.app" 2>&1 | grep -E '^TeamIdentifier=A3W973JZ49$'
          echo "MAC_CONTROL_MCP_TEST_FIXTURE_APP=$DIR/MacControlMCP.app" >> "$GITHUB_ENV"

      - name: node --test
        working-directory: npm
        run: |
          node --test 2>&1 | tee /tmp/node-test.log
          test "${PIPESTATUS[0]}" -eq 0
          # The signed-fixture tests must have run, not skipped: a skip here
          # means the fixture step silently stopped delivering coverage.
          if grep -qE '^ok .*# SKIP' /tmp/node-test.log; then
            echo "Skipped tests detected — the signed fixture was not usable." >&2
            exit 1
          fi

      - name: npm pack --dry-run
        # Runs the prepack gate, which fails the job if npm/package.json and
        # server.json ever drift apart, and prints the published file list so
        # a stray vendor/ or test/ file is visible in the log.
        working-directory: npm
        run: npm pack --dry-run
